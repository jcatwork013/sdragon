<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>SDrakon — Proto-Dragon Realm</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1233">
<meta name="description" content="Match-3 nuôi rồng: chọn trứng, ấp nở, ghép đá quý và huấn luyện rồng của bạn.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SDrakon">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<!-- Font nằm trong fonts/ (OFL, có dấu tiếng Việt) — game không gọi ra mạng lần nào -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-title">SDrakon</div>
        <div class="boot-sub">Proto-Dragon Realm</div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-dots"><span></span><span></span><span></span></div>
        <div class="boot-hint" id="bootHint">đang thắp đèn ngoài bờ cỏ…</div>
      </div>
    </div>
  </div>

  <div id="rotate">
    <div>
      <div style="font-size:56px;line-height:1.4">📱↻</div>
      Xoay ngang thiết bị để chơi<br>
      <span style="font-size:15px;opacity:.6">Rotate your device to play</span>
    </div>
  </div>

  <button id="install" hidden>Cài đặt ứng dụng</button>

  <script type="module" src="js/main.js"></script>
  <script>
  // ── Mẹo chơi đổi vòng trong lúc chờ — biến thời gian chết thành thời gian
  // dạy luật. Chạy bằng JS thường (không phải module) nên hiện ngay lập tức,
  // không phải đợi bundle game tải xong.
  (function () {
    var vi = navigator.language && navigator.language.slice(0, 2) === 'en' ? 0 : 1;
    var TIPS = [
      ['Chains of 4 or more leave a special gem behind.', 'Ghép từ 4 viên trở lên là để lại một viên đá đặc biệt.'],
      ['The clock never stops — grab the CLOCK badges.', 'Đồng hồ chạy không ngừng — nhớ nhặt huy hiệu ĐỒNG HỒ.'],
      ['A wrong swap still costs you a move.', 'Đi sai nước vẫn mất một lượt như thường.'],
      ['Losing a duel teaches you the foe’s habit.', 'Thua một trận tỉ thí là học được thói quen của đối thủ.'],
      ['Craft gear at the Nest — it counts in duels too.', 'Chế đồ ở Tổ dế — mặc vào là mạnh thật trong trận tỉ thí.'],
      ['Tap the cricket. It has opinions.', 'Chạm vào con dế xem nó nói gì. Nó lắm mồm lắm.'],
    ];
    var el = document.getElementById('bootHint'), i = 0;
    if (!el) return;
    el.textContent = TIPS[0][vi];
    setInterval(function () {
      el.style.opacity = 0;
      setTimeout(function () {
        i = (i + 1) % TIPS.length;
        el.textContent = TIPS[i][vi];
        el.style.opacity = 1;
      }, 350);
    }, 2600);
  })();

  // ── Service worker: chơi ngoại tuyến. Bỏ qua khi mở bằng file:// hoặc trong Electron.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  // ── Nút cài đặt: chỉ hiện khi trình duyệt thật sự cho cài
  let deferred = null;
  const btn = document.getElementById('install');
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; btn.hidden = false; });
  btn.addEventListener('click', async () => {
    btn.hidden = true;
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
  });
  addEventListener('appinstalled', () => { btn.hidden = true; deferred = null; });

  // ── Trên di động: chạm lần đầu thì vào toàn màn hình + khoá xoay ngang
  const goFullscreen = async () => {
    if (!matchMedia('(pointer:coarse)').matches) return;
    try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch {}
    try { await screen.orientation.lock('landscape'); } catch {}
  };
  addEventListener('pointerdown', goFullscreen, { once: true });

  // chặn thao tác cuộn/zoom của trình duyệt nuốt mất input của game
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
